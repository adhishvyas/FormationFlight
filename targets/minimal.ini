; Barest-minimum build: boots straight into WiFi AP mode and serves the
; web-based OTA update page. No LoRa/ESPNOW radio, GNSS, peers, display,
; MSP, crypto, or stats - just enough to flash the real firmware over the air.

[env:minimal_ota_esp8266]
extends = env_common_esp82xx
build_flags =
	${env_common_esp82xx.build_flags}
	'-D CFG_TARGET_NAME="MinimalOTA"'
	'-D CFG_TARGET_FULLNAME="Minimal OTA ESP8266"'
	-D MINIMAL_BUILD
